<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        input { flex: 1; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #007bff; }
        li.High { border-left-color: #dc3545; }
        li.Medium { border-left-color: #ffc107; }
        .completed { text-decoration: line-through; color: gray; }
        .del-btn { background: #dc3545; padding: 5px 8px; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Task Manager</h2>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter new task...">
        <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
        <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        tasks.forEach((task, index) => {
            list.innerHTML += `
                <li class="${task.priority}">
                    <span class="${task.completed ? 'completed' : ''}" onclick="toggleTask(${index})" style="cursor:pointer;">
                        ${task.text} <small>(${task.priority})</small>
                    </span>
                    <button class="del-btn" onclick="deleteTask(${index})">Delete</button>
                </li>`;
        });
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const priority = document.getElementById('priority').value;
        if (input.value.trim() === '') return;
        tasks.push({ text: input.value, priority: priority, completed: false });
        input.value = '';
        renderTasks();
    }

    function toggleTask(index) {
        tasks[index].completed = !tasks[index].completed;
        renderTasks();
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        renderTasks();
    }

    renderTasks();
</script>
</body>
</html>
